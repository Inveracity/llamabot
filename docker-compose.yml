version: '3.8'

services:
  ollama-small:
    image: ollama/ollama:latest
    container_name: ollama-small
    volumes:
      - ./ollama_data:/root/.ollama
      - ./ollama-entrypoint.sh:/entrypoint.sh
    ports:
      - "11435:11435"
    restart: unless-stopped
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_MAX_QUEUE=1
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11435/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  llama-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beardfist-bot
    depends_on:
      ollama-small:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=http://ollama-small:11435
    restart: unless-stopped
