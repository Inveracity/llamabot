services:
  ollama-small:
    image: ollama/ollama:latest
    container_name: ollama-small
    volumes:
      - ./ollama_data:/root/.ollama
      - ./ollama-entrypoint.sh:/entrypoint.sh
    restart: unless-stopped
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_MAX_QUEUE=1
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  llama-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beardfist-bot
    depends_on:
      ollama-small:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=http://ollama-small:11434
    restart: unless-stopped
